<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plainsong</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plain-text music notation that compiles to MIDI and audio. Try the compiler in your browser, with nothing installed.">
<!-- The demo is the front door: a working compiler in one file, no server and
     no network. Anyone arriving at the Pages root wants that, not a directory
     listing of markdown. The redirect is meta+script+link so it works with
     scripting disabled and still leaves something to click if both fail. -->
<meta http-equiv="refresh" content="0; url=./demo/">
<link rel="canonical" href="./demo/">
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #faf8f4; color: #1a1714; }
  @media (prefers-color-scheme: dark) { body { background: #14120f; color: #f2ede6; } }
  main { text-align: center; padding: 2rem; max-width: 34rem; }
  h1 { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.6rem; margin: 0 0 .5rem; }
  p { line-height: 1.6; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Plainsong</h1>
  <p>Plain-text music notation that compiles to MIDI and audio.</p>
  <p>Taking you to the <a href="./demo/">browser demo</a> — a working compiler in
     one file, with nothing installed.</p>
  <p><a href="https://github.com/SuperInstance/plainsong">Source on GitHub</a> ·
     <a href="https://pypi.org/project/plainsong/">Install from PyPI</a></p>
</main>
</body>
</html>
