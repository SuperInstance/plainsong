<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainsong</title>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --border: #e2e1dd;
    --text: #1c1b19;
    --muted: #6f6d68;
    --accent: #2f6f5e;
    --accent-soft: #e6f0ec;
    --warn: #8a6100;
    --error: #a32b1f;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1d1d22;
      --border: #2e2e35;
      --text: #e8e7e4;
      --muted: #96948e;
      --accent: #6cc0a4;
      --accent-soft: #1f3630;
      --warn: #d9a441;
      --error: #e0705f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--sans);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  header .spacer { flex: 1; }

  main { flex: 1; display: grid; grid-template-columns: 260px 1fr 380px; min-height: 0; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(0, auto); } }

  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); }
  section:last-child { border-right: none; }
  .head {
    padding: 9px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .body { flex: 1; overflow: auto; min-height: 0; }

  input[type=search], input[type=text] {
    width: 100%; padding: 7px 10px; font: 13px var(--sans);
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .entry { padding: 7px 14px; cursor: pointer; border-bottom: 1px solid transparent; }
  .entry:hover { background: var(--accent-soft); }
  .entry.active { background: var(--accent-soft); border-left: 2px solid var(--accent); }
  .entry .t { font-size: 13px; }
  .entry .s { color: var(--muted); font-size: 11px; font-family: var(--mono); }

  textarea {
    flex: 1; width: 100%; resize: none; border: none; padding: 14px 16px;
    font: 13px/1.6 var(--mono); background: var(--panel); color: var(--text);
    tab-size: 2; white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }

  .bar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  button {
    font: 13px var(--sans); padding: 6px 13px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }
  button.primary:hover:not(:disabled) { opacity: .9; color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }

  .pad { padding: 14px 16px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12.5px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-family: var(--mono); }

  .diag { font-size: 12px; font-family: var(--mono); padding: 6px 0; border-top: 1px solid var(--border); }
  .diag.warning { color: var(--warn); }
  .diag.error { color: var(--error); }
  .diag .hint { color: var(--muted); }

  audio { width: 100%; margin-top: 12px; }

  .chat { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  .msg { padding: 9px 12px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { background: var(--accent-soft); }
  .msg.agent { border: 1px solid var(--border); }
  .msg.tool { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 3px 12px; }
  .msg.err { border: 1px solid var(--error); color: var(--error); }

  .empty { color: var(--muted); padding: 18px 16px; font-size: 13px; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Plainsong</h1>
  <span class="meta" id="status">starting</span>
  <span class="spacer"></span>
  <span class="meta" id="provider"></span>
</header>

<main>
  <section>
    <div class="head">Library</div>
    <div class="pad" style="padding-bottom:0">
      <input type="search" id="search" placeholder="search" autocomplete="off">
    </div>
    <div class="body" id="library"><div class="empty">loading</div></div>
  </section>

  <section>
    <div class="head">
      <span id="filename">untitled.song</span>
      <span class="spacer grow"></span>
      <span class="tag" id="charcount"></span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Write notation here, or pick something from the library."></textarea>
    <div class="bar">
      <button class="primary" id="compile">Compile</button>
      <button id="play" disabled>Play</button>
      <button id="download" disabled>MIDI</button>
      <span class="spacer grow"></span>
      <input type="text" id="key" placeholder="key" style="width:70px">
      <button id="transpose">Transpose</button>
      <button id="starter">New</button>
    </div>
  </section>

  <section>
    <div class="head">Result</div>
    <div class="body" id="result"><div class="empty">Compile to see the arrangement.</div></div>
    <div class="head" style="border-top:1px solid var(--border)">Agent</div>
    <div class="body" id="chat" style="max-height:40vh"><div class="empty">Ask for a piece, or a change to the one in the editor.</div></div>
    <div class="bar">
      <input type="text" id="prompt" class="grow" placeholder="write a slow waltz in D minor">
      <button id="send" class="primary">Send</button>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { entries: [], active: null, audioUrl: null, midiUrl: null, busy: false };

function setStatus(text) { $("status").textContent = text; }

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).error || detail; } catch (_) {}
    throw new Error(detail);
  }
  return response.json();
}

async function post(path, payload) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

// -- library ---------------------------------------------------------------

async function loadLibrary(query) {
  try {
    const data = await api("/api/library?limit=60&q=" + encodeURIComponent(query || ""));
    state.entries = data.entries;
    renderLibrary(data.total);
  } catch (error) {
    $("library").innerHTML = '<div class="empty">could not load the library: ' + escapeHtml(error.message) + "</div>";
  }
}

function renderLibrary(total) {
  const host = $("library");
  if (!state.entries.length) {
    host.innerHTML = '<div class="empty">nothing found</div>';
    return;
  }
  host.innerHTML = "";
  for (const entry of state.entries) {
    const node = document.createElement("div");
    node.className = "entry" + (state.active === entry.name ? " active" : "");
    node.innerHTML =
      '<div class="t">' + escapeHtml(entry.title || entry.name) + "</div>" +
      '<div class="s">' + escapeHtml([entry.key, entry.tempo ? entry.tempo + " bpm" : "", entry.collection]
        .filter(Boolean).join("  ")) + "</div>";
    node.onclick = () => openEntry(entry);
    host.appendChild(node);
  }
  if (total > state.entries.length) {
    const note = document.createElement("div");
    note.className = "empty";
    note.textContent = state.entries.length + " of " + total;
    host.appendChild(note);
  }
}

async function openEntry(entry) {
  setStatus("loading " + entry.name);
  try {
    const data = await api("/api/entry?name=" + encodeURIComponent(entry.name));
    if (data.error) throw new Error(data.error);
    $("editor").value = data.content;
    $("filename").textContent = entry.name + ".song";
    state.active = entry.name;
    renderLibrary(state.entries.length);
    updateCount();
    setStatus("loaded");
  } catch (error) {
    setStatus("error: " + error.message);
  }
}

// -- compile ---------------------------------------------------------------

async function compile() {
  const content = $("editor").value;
  if (!content.trim()) { setStatus("nothing to compile"); return; }
  setBusy(true, "compiling");
  try {
    const data = await post("/api/compile", { content, audio: true });
    renderResult(data);
    setStatus(data.ok ? "compiled" : "compilation failed");
  } catch (error) {
    setStatus("error: " + error.message);
    $("result").innerHTML = '<div class="pad diag error">' + escapeHtml(error.message) + "</div>";
  } finally {
    setBusy(false);
  }
}

function renderResult(data) {
  const host = $("result");
  host.innerHTML = "";
  if (data.error) {
    host.innerHTML = '<div class="pad diag error">' + escapeHtml(data.error) + "</div>";
    return;
  }

  const score = data.score || {};
  const arrangement = data.arrangement || {};
  const facts = document.createElement("dl");
  facts.className = "facts";
  const rows = [
    ["title", score.title],
    ["key", score.key],
    ["tempo", score.tempo ? score.tempo + " bpm" : ""],
    ["metre", score.meter],
    ["sections", score.sections],
    ["notes", arrangement.notes],
    ["length", arrangement.seconds ? arrangement.seconds + "s" : ""],
    ["voices", (arrangement.tracks || []).map((t) => t.name + " (" + t.notes + ")").join(", ")],
  ];
  for (const [label, value] of rows) {
    if (value === undefined || value === null || value === "") continue;
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd"); dd.textContent = value;
    facts.appendChild(dt); facts.appendChild(dd);
  }
  const wrap = document.createElement("div");
  wrap.className = "pad";
  wrap.appendChild(facts);

  state.audioUrl = data.audio_url || null;
  state.midiUrl = data.midi_url || null;
  $("play").disabled = !state.audioUrl;
  $("download").disabled = !state.midiUrl;

  if (state.audioUrl) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = state.audioUrl + "?t=" + Date.now();
    wrap.appendChild(audio);
  }
  host.appendChild(wrap);

  for (const message of data.messages || []) {
    const node = document.createElement("div");
    node.className = "pad diag warning";
    node.textContent = message;
    host.appendChild(node);
  }

  const problems = (data.diagnostics || []).filter((d) => d.severity !== "info");
  if (problems.length) {
    const box = document.createElement("div");
    box.className = "pad";
    for (const problem of problems.slice(0, 40)) {
      const node = document.createElement("div");
      node.className = "diag " + problem.severity;
      node.textContent = "line " + problem.line + ": " + problem.message;
      if (problem.hint) {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = problem.hint;
        node.appendChild(hint);
      }
      box.appendChild(node);
    }
    host.appendChild(box);
  }
}

// -- agent -----------------------------------------------------------------

function bubble(kind, text) {
  const chat = $("chat");
  if (chat.querySelector(".empty")) chat.innerHTML = '<div class="chat"></div>';
  let inner = chat.querySelector(".chat");
  if (!inner) { inner = document.createElement("div"); inner.className = "chat"; chat.appendChild(inner); }
  const node = document.createElement("div");
  node.className = "msg " + kind;
  node.textContent = text;
  inner.appendChild(node);
  chat.scrollTop = chat.scrollHeight;
  return node;
}

async function send() {
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  $("prompt").value = "";
  bubble("you", prompt);
  const pending = bubble("tool", "thinking ...");
  setBusy(true, "agent running");
  try {
    const editor = $("editor").value.trim();
    const payload = { prompt: editor ? prompt + "\n\nThe notation currently open:\n\n" + editor : prompt };
    const data = await post("/api/agent", payload);
    pending.remove();
    for (const event of data.events || []) {
      if (event.kind === "tool_call") bubble("tool", "- " + event.text);
    }
    if (data.error) bubble("err", data.error);
    else bubble("agent", data.reply || "(no reply)");
    setStatus("agent finished in " + (data.steps || 0) + " step(s)");
    loadLibrary($("search").value);
  } catch (error) {
    pending.remove();
    bubble("err", error.message);
    setStatus("error");
  } finally {
    setBusy(false);
  }
}

// -- misc ------------------------------------------------------------------

function setBusy(busy, label) {
  state.busy = busy;
  for (const id of ["compile", "send", "transpose", "starter"]) $(id).disabled = busy;
  if (label) setStatus(label);
}

function updateCount() {
  const value = $("editor").value;
  $("charcount").textContent = value ? value.split("\n").length + " lines" : "";
}

function escapeHtml(text) {
  const node = document.createElement("div");
  node.textContent = String(text == null ? "" : text);
  return node.innerHTML;
}

async function transpose() {
  const key = $("key").value.trim();
  if (!key) { setStatus("enter a key first, such as Dm or +3"); return; }
  setBusy(true, "transposing");
  try {
    const data = await post("/api/transpose", { content: $("editor").value, key });
    if (data.error) throw new Error(data.error);
    $("editor").value = data.content;
    updateCount();
    setStatus("transposed to " + key);
  } catch (error) {
    setStatus("error: " + error.message);
  } finally {
    setBusy(false);
  }
}

// -- wiring ----------------------------------------------------------------

$("compile").onclick = compile;
$("send").onclick = send;
$("transpose").onclick = transpose;
$("play").onclick = () => {
  const audio = document.querySelector("audio");
  if (audio) { audio.currentTime = 0; audio.play(); }
};
$("download").onclick = () => { if (state.midiUrl) window.location.href = state.midiUrl; };
$("starter").onclick = async () => {
  const data = await api("/api/examples");
  $("editor").value = data.starter;
  $("filename").textContent = "untitled.song";
  state.active = null;
  updateCount();
  renderLibrary(state.entries.length);
};
$("editor").addEventListener("input", updateCount);
$("prompt").addEventListener("keydown", (event) => { if (event.key === "Enter") send(); });

let searchTimer = null;
$("search").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadLibrary(event.target.value), 180);
});

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "Enter") { event.preventDefault(); compile(); }
});

(async function start() {
  try {
    const status = await api("/api/status");
    $("provider").textContent = status.provider + (status.model ? " / " + status.model : "");
    setStatus("ready");
  } catch (_) {
    setStatus("offline");
  }
  loadLibrary("");
})();
</script>
</body>
</html>
