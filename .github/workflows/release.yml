name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the only thing that says which version this is, and nothing
      # else in the repository knows about it. Without this a `v1.1.0` tag on a
      # tree still saying 1.0.0 publishes 1.0.0 -- under a release page claiming
      # otherwise, and unfixably, because PyPI will not accept that filename
      # twice. A test already holds pyproject and version.py to each other; this
      # holds the tag to both.
      - name: The tag must match the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import plainsong.version as v; print(v.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, plainsong/version.py says $version" >&2
            exit 1
          fi
          echo "releasing $version"

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Verify the specs
        run: python -m plainsong spec

      - name: Every documented example still compiles
        run: python -m plainsong check docs examples plainsong/songbook README.md

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release cannot create a release without it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
