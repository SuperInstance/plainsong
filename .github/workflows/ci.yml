name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The headline claim is that a clean checkout works with nothing installed.
  # This job installs nothing, so a dependency creeping into the core breaks it.
  stdlib:
    name: stdlib only (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show what the host looks like
        run: python -m plainsong doctor

      - name: Verify the specs
        run: python -m plainsong spec

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Compile something end to end
        run: |
          python -m plainsong new "CI Check" -o ci-check.song
          python -m plainsong compile ci-check.song -o ci.mid --audio ci.wav
          python -m plainsong info ci-check.song

  # The optional accelerators must not change behaviour, only speed.
  accelerated:
    name: with numpy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m plainsong spec
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check plainsong tests
      - run: ruff format --check plainsong tests
        continue-on-error: true

  corpus:
    name: notation library still parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every .song file in the repository
        run: python -m plainsong check docs examples plainsong/songbook README.md

      # `check` proves the corpus still compiles. It says nothing about whether
      # it compiles to the same notes, and the difference is not academic: with
      # every major seventh in the package flattened by a semitone, `check`
      # reports "ok 6333 file(s) checked" and the library.compat spec passes.
      # This step catches it -- 235 files, all with identical note counts, so
      # only the hash moves.
      #
      # When a change here is intended, re-record with
      #   python -m plainsong fingerprint docs examples plainsong/songbook \
      #     --write tests/corpus-fingerprint.txt
      # and the diff on that file is the review: it names every piece that
      # changed and by how many notes.
      - name: The corpus compiles to the same music it did before
        run: >
          python -m plainsong fingerprint docs examples plainsong/songbook
          --check tests/corpus-fingerprint.txt
