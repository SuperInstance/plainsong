name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The headline claim is that a clean checkout works with nothing installed.
  # This job installs nothing, so a dependency creeping into the core breaks it.
  stdlib:
    name: stdlib only (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show what the host looks like
        run: python -m tapscript doctor

      - name: Verify the specs
        run: python -m tapscript spec

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Compile something end to end
        run: |
          python -m tapscript new "CI Check" -o ci-check.tap
          python -m tapscript compile ci-check.tap -o ci.mid --audio ci.wav
          python -m tapscript info ci-check.tap

  # The optional accelerators must not change behaviour, only speed.
  accelerated:
    name: with numpy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m tapscript spec
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check tapscript tests
      - run: ruff format --check tapscript tests
        continue-on-error: true

  corpus:
    name: notation library still parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every .tap file in the repository
        run: python -m tapscript check docs examples academy
