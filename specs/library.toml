[spec]
id = "library.compat"
title = "Existing notation still compiles"
why = """
There are several thousand .tap files in this repository, written against
earlier versions of the notation. A change to the parser that breaks them is a
regression no matter how much better the new behaviour reads.
"""
tags = ["compat"]

[[check]]
id = "corpus"
kind = "python"
run = "tapscript.selfcheck:check_corpus"
description = "A sample of the bundled library parses without errors"
