[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plainsong"
version = "1.4.0"
description = "Plain-text music notation that compiles to MIDI and audio, with an embedded agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["music", "notation", "midi", "composition", "lead sheet", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Artistic Software",
]

# No required dependencies. The compiler, the interfaces and every provider
# adapter run on the standard library alone. See [project.optional-dependencies]
# for accelerators.
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.21"]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
plainsong = "plainsong.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/plainsong"
Documentation = "https://github.com/SuperInstance/plainsong/tree/master/docs"
Source = "https://github.com/SuperInstance/plainsong"
Changelog = "https://github.com/SuperInstance/plainsong/blob/master/CHANGELOG.md"
Issues = "https://github.com/SuperInstance/plainsong/issues"
"For agents" = "https://github.com/SuperInstance/plainsong/blob/master/AGENTS.md"

[tool.setuptools.packages.find]
include = ["plainsong*"]

[tool.setuptools.package-data]
plainsong = [
    "llm/catalog.json",
    "agent/prompts/*.md",
    "interfaces/web/*.html",
    "spec_files/*.toml",
    "songbook/**/*.song",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 108
target-version = "py310"
# `legacy/` is not maintained and needs numpy, scipy and flask. It also holds
# unrelated work that is still active, so it is excluded rather than fixed.
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are caught by the formatter, not the linter
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
